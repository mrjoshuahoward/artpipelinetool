[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "artpipeline"
version = "2.0.0"
description = "State and operations engine for agent-driven game art production in Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "Pillow>=11.0",
    "PyYAML>=6.0.2",
    "resvg-py>=0.5",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
artpipeline = "artpipeline.cli:main"

[tool.setuptools.packages.find]
include = ["artpipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
